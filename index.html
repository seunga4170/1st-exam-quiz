<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중간고사 대비 퀴즈 포털</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative">

  <!-- 🔒 비밀번호 입력 모달 -->
  <div id="password-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="max-w-xs w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl text-center">
      <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 border border-indigo-500/20">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-lg font-bold text-white mb-1">보안 접속</h2>
      <p class="text-xs text-slate-400 mb-5">비밀번호를 입력해야 과목 데이터가 복호화됩니다.</p>
      
      <form id="password-form" class="space-y-3">
        <input 
          type="password" 
          id="password-input" 
          placeholder="비밀번호 입력" 
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-center text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 transition"
          autocomplete="off"
        >
        <p id="password-error" class="hidden text-xs text-rose-400 font-medium">비밀번호가 올바르지 않습니다.</p>
        <button 
          type="submit" 
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30"
        >
          입장하기
        </button>
      </form>
    </div>
  </div>

  <!-- 📖 메인 포털 화면 (비밀번호 복호화 성공 전까지 빈 화면) -->
  <div id="portal-content" class="hidden max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl text-center">
    <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 border border-indigo-500/20">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    
    <h1 class="text-2xl font-extrabold text-white tracking-tight mb-2">중간고사 벼락치기 포털</h1>
    <p class="text-xs sm:text-sm text-slate-400 mb-8">
      시험 대비 주차별 핵심 기출 및 변형 문제 연습
    </p>

    <!-- 복호화 성공 시 동적으로 주입되는 영역 -->
    <div id="subject-list" class="space-y-3.5"></div>

    <div class="mt-8 text-xs text-slate-500">
      새로고침할 때마다 문제 순서와 보기가 무작위로 변경됩니다.
    </div>
  </div>

  <script>
    // '2026quiz'의 SHA-256 해시 검증값 (소스 보기를 해도 원래 비밀번호 유추 불가)
    const VERIFY_HASH = "815fe2b7f035f52479e4ca2bf74070a25698b7dc3f837eb5f08ca6fa6b78491c";

    // 비밀번호로 난독화/암호화된 과목 페이로드
    const CIPHER_DATA = "W17lh6jnl5zsnZnroZjsgqDvuqcgRm9vZEFuZEN1bHR1cmVRdWl6L0Zvb2RBbmRDdWx0dXJlUXVpei5odG1szrdhbWJlcnvuqTEjOHso7zssKgg7Leo7KCV66asfXzsobJBSTrsubztlZwg6riw7LSI7IiY7ZWZSXvuqSBNYXRoUXVpei9tYXRoUXVpei5odG1szrdpbmRpZ2/vuqQyfjfq77mM7LCoIOynhOuyleyEnOuNsOyekO2VqX187LOyQ+2UhOuhnOq3uOuemOuvjO+6pCBDUHJvZ3JhbW1pbmcvQ1Byb2dyYW1taW5nLmh0bWzOt2VtZXJhbGTvuqQxPjfq77mM7LCoIOusuOuylSnsnpDslyntlajsiJt9fOy0tOuNsOydtO2EsOyCrOydtOyWkeyKpCDquLDstI/vuqQgRGF0YVNjaWVuY2VRdWl6L0RhdGFTY2llbmNlUXVpei5odG1szrdjeWFu77qk7ZW17IesIOqwnOuFleuNsOydtO2EsCDrtoTshowg7Iuk7KCEfQ==";

    const modal = document.getElementById('password-modal');
    const content = document.getElementById('portal-content');
    const form = document.getElementById('password-form');
    const input = document.getElementById('password-input');
    const errorMsg = document.getElementById('password-error');
    const subjectList = document.getElementById('subject-list');

    // SHA-256 단방향 해시 생성 함수
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 비밀번호 키와 XOR 기반 복호화
    function decryptPayload(encoded, key) {
      const binaryStr = atob(encoded);
      const bytes = new Uint8Array(binaryStr.length);
      for (let i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }
      const rawStr = new TextDecoder().decode(bytes);

      const items = rawStr.split('||');
      const icons = {
        'amber': 'fa-utensils',
        'indigo': 'fa-square-root-variable',
        'emerald': 'fa-code',
        'cyan': 'fa-chart-line'
      };

      return items.map(item => {
        const parts = item.split('|');
        const color = parts[2];
        return {
          title: parts[0],
          url: parts[1],
          colorClass: color,
          desc: parts[3],
          icon: icons[color] || 'fa-book',
          hoverBg: `hover:bg-${color}-500`,
          hoverBorder: `hover:border-${color}-400`,
          groupHoverText: `group-hover:text-${color}-400`,
          groupHoverSubText: color === 'amber' ? 'group-hover:text-slate-900' : 'group-hover:text-white'
        };
      });
    }

    function renderSubjects(subjects) {
      modal.classList.add('hidden');
      content.classList.remove('hidden');

      subjectList.innerHTML = subjects.map(s => `
        <a href="${s.url}" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-800/80 ${s.hoverBg} border border-slate-700/80 ${s.hoverBorder} transition-all duration-200 text-left shadow-sm">
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-xl bg-${s.colorClass}-500/20 text-${s.colorClass}-400 group-hover:bg-slate-950 ${s.groupHoverText} flex items-center justify-center text-lg transition">
              <i class="fa-solid ${s.icon}"></i>
            </div>
            <div>
              <div class="font-bold text-white group-hover:text-white transition text-sm sm:text-base">${s.title}</div>
              <div class="text-xs text-slate-400 ${s.groupHoverSubText} transition">${s.desc}</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-white transition"></i>
        </a>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const enteredPassword = input.value.trim();
      const hash = await sha256(enteredPassword);

      if (hash === VERIFY_HASH) {
        try {
          const subjects = decryptPayload(CIPHER_DATA, enteredPassword);
          sessionStorage.setItem('portal_cache', JSON.stringify(subjects));
          renderSubjects(subjects);
        } catch (err) {
          errorMsg.textContent = "복호화 오류가 발생했습니다.";
          errorMsg.classList.remove('hidden');
        }
      } else {
        errorMsg.textContent = "비밀번호가 올바르지 않습니다.";
        errorMsg.classList.remove('hidden');
        input.value = '';
        input.focus();
      }
    });

    // 세션 유지 확인
    const cached = sessionStorage.getItem('portal_cache');
    if (cached) {
      try {
        renderSubjects(JSON.parse(cached));
      } catch (e) {
        input.focus();
      }
    } else {
      input.focus();
    }
  </script>
</body>
</html>
