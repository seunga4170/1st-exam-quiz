<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중간고사 대비 퀴즈 포털</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative">

  <!-- 🔒 비밀번호 잠금 화면 모달 -->
  <div id="password-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="max-w-xs w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl text-center">
      <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 border border-indigo-500/20">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-lg font-bold text-white mb-1">접근 제한</h2>
      <p class="text-xs text-slate-400 mb-5">시험 대비 퀴즈 모음 사이트입니다.<br>비밀번호를 입력해 주세요.</p>
      
      <form id="password-form" class="space-y-3">
        <input 
          type="password" 
          id="password-input" 
          placeholder="비밀번호 입력" 
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-center text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 transition"
          autocomplete="off"
        >
        <p id="password-error" class="hidden text-xs text-rose-400 font-medium">비밀번호가 일치하지 않습니다.</p>
        <button 
          type="submit" 
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30"
        >
          입장하기
        </button>
      </form>
    </div>
  </div>

  <!-- 📖 메인 퀴즈 선택 포털 화면 (비밀번호 확인 전까지 숨김) -->
  <div id="portal-content" class="hidden max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl text-center">
    <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 border border-indigo-500/20">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    
    <h1 class="text-2xl font-extrabold text-white tracking-tight mb-2">중간고사 벼락치기 포털</h1>
    <p class="text-xs sm:text-sm text-slate-400 mb-8">
      시험 대비를 위한 주차별 핵심 기출 및 변형 문제 연습
    </p>

    <!-- 과목 선택 버튼 목록 -->
    <div class="space-y-3.5">
      <!-- 1. 식생활과 문화 -->
      <a href="FoodAndCultureQuiz/FoodAndCultureQuiz.html" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-800/80 hover:bg-amber-500 border border-slate-700/80 hover:border-amber-400 transition-all duration-200 text-left shadow-sm">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 group-hover:bg-slate-950 group-hover:text-amber-400 flex items-center justify-center text-lg transition">
            <i class="fa-solid fa-utensils"></i>
          </div>
          <div>
            <div class="font-bold text-white group-hover:text-slate-950 transition text-sm sm:text-base">식생활과 문화</div>
            <div class="text-xs text-slate-400 group-hover:text-slate-900 transition">1~8주차 총정리</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-slate-950 transition"></i>
      </a>

      <!-- 2. AI를 위한 기초수학I -->
      <a href="MathQuiz/mathQuiz.html" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-800/80 hover:bg-indigo-600 border border-slate-700/80 hover:border-indigo-500 transition-all duration-200 text-left shadow-sm">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 group-hover:bg-slate-950 group-hover:text-indigo-400 flex items-center justify-center text-lg transition">
            <i class="fa-solid fa-square-root-variable"></i>
          </div>
          <div>
            <div class="font-bold text-white group-hover:text-white transition text-sm sm:text-base">AI를 위한 기초수학I</div>
            <div class="text-xs text-slate-400 group-hover:text-indigo-200 transition">2~7주차 진법·논리·집합</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-white transition"></i>
      </a>

      <!-- 3. C프로그래밍 -->
      <a href="CProgramming/CProgramming.html" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-800/80 hover:bg-emerald-600 border border-slate-700/80 hover:border-emerald-500 transition-all duration-200 text-left shadow-sm">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 group-hover:bg-slate-950 group-hover:text-emerald-400 flex items-center justify-center text-lg transition">
            <i class="fa-solid fa-code"></i>
          </div>
          <div>
            <div class="font-bold text-white group-hover:text-white transition text-sm sm:text-base">C프로그래밍</div>
            <div class="text-xs text-slate-400 group-hover:text-emerald-200 transition">1~7주차 문법·배열·함수</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-white transition"></i>
      </a>

      <!-- 4. 데이터사이언스 기초 -->
      <a href="DataScienceQuiz/DataScienceQuiz.html" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-800/80 hover:bg-cyan-600 border border-slate-700/80 hover:border-cyan-500 transition-all duration-200 text-left shadow-sm">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-cyan-500/20 text-cyan-400 group-hover:bg-slate-950 group-hover:text-cyan-400 flex items-center justify-center text-lg transition">
            <i class="fa-solid fa-chart-line"></i>
          </div>
          <div>
            <div class="font-bold text-white group-hover:text-white transition text-sm sm:text-base">데이터사이언스 기초</div>
            <div class="text-xs text-slate-400 group-hover:text-cyan-200 transition">핵심 개념·데이터 분석 실전</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-white transition"></i>
      </a>
    </div>

    <div class="mt-8 text-xs text-slate-500">
      새로고침할 때마다 문제 순서와 보기가 무작위로 변경됩니다.
    </div>
  </div>

  <!-- 🔐 비밀번호 검증 로직 -->
  <script>
    // 원하는 사이트 비밀번호를 여기에 적어주세요.
    const SITE_PASSWORD = "2026quiz"; 

    const modal = document.getElementById('password-modal');
    const content = document.getElementById('portal-content');
    const form = document.getElementById('password-form');
    const input = document.getElementById('password-input');
    const errorMsg = document.getElementById('password-error');

    // 이미 한 번 인증한 적이 있는지 체크 (브라우저 창 닫기 전까지 유지)
    if (sessionStorage.getItem('quiz_auth') === 'granted') {
      modal.classList.add('hidden');
      content.classList.remove('hidden');
    } else {
      input.focus();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const entered = input.value.trim();

      if (entered === SITE_PASSWORD) {
        sessionStorage.setItem('quiz_auth', 'granted');
        modal.classList.add('hidden');
        content.classList.remove('hidden');
      } else {
        errorMsg.classList.remove('hidden');
        input.value = '';
        input.focus();
      }
    });
  </script>
</body>
</html>
