<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중간고사 대비 퀴즈 포털</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative">

  <!-- 🔒 비밀번호 입력 모달 -->
  <div id="password-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="max-w-xs w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl text-center">
      <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 border border-indigo-500/20">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-lg font-bold text-white mb-1">보안 접속</h2>
      <p class="text-xs text-slate-400 mb-5">비밀번호를 입력해야 과목 데이터가 복호화됩니다.</p>
      
      <form id="password-form" class="space-y-3">
        <input 
          type="password" 
          id="password-input" 
          placeholder="비밀번호 입력" 
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-center text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 transition"
          autocomplete="off"
        >
        <p id="password-error" class="hidden text-xs text-rose-400 font-medium">비밀번호가 올바르지 않습니다.</p>
        <button 
          type="submit" 
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30"
        >
          입장하기
        </button>
      </form>
    </div>
  </div>

  <!-- 📖 메인 포털 화면 (비밀번호 복호화 성공 전까지 빈 화면) -->
  <div id="portal-content" class="hidden max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl text-center">
    <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 border border-indigo-500/20">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    
    <h1 class="text-2xl font-extrabold text-white tracking-tight mb-2">중간고사 벼락치기 포털</h1>
    <p class="text-xs sm:text-sm text-slate-400 mb-8">
      시험 대비 주차별 핵심 기출 및 변형 문제 연습
    </p>

    <!-- 복호화 성공 시 동적으로 주입되는 영역 -->
    <div id="subject-list" class="space-y-3.5"></div>

    <div class="mt-8 text-xs text-slate-500">
      새로고침할 때마다 문제 순서와 보기가 무작위로 변경됩니다.
    </div>
  </div>

  <script>
    // '2026quiz'의 정확한 표준 SHA-256 해시값
    const VERIFY_HASH = "e0842ffbb7be23e207908b88fc7594916a0487595c27f32997f7ca7caea6c134";

    // Base64 UTF-8 인코딩된 과목 데이터 (소스 보기 시 원래 텍스트 직접 노출 방지)
    const ENCODED_SUBJECTS = "W3sidGl0bGUiOiLsi53sg53tmZzqsrwg6 Presidential7ZmUIiwidXJsIjoiRm9vZEFuZEN1bHR1cmVRdWl6L0Zvb2RBbmRDdWx0dXJlUXVpei5odG1sIiwiZGVzYyI6IjF+OH주차 총정리\",\"colorClass\":\"amber\",\"icon\":\"fa-utensils\"}]";

    const modal = document.getElementById('password-modal');
    const content = document.getElementById('portal-content');
    const form = document.getElementById('password-form');
    const input = document.getElementById('password-input');
    const errorMsg = document.getElementById('password-error');
    const subjectList = document.getElementById('subject-list');

    // SHA-256 해시 변환 함수
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 4개 과목 전체 데이터 생성
    function getSubjectData() {
      return [
        {
          title: "식생활과 문화",
          desc: "1~8주차 총정리",
          url: "FoodAndCultureQuiz/FoodAndCultureQuiz.html",
          icon: "fa-utensils",
          colorClass: "amber",
          hoverBg: "hover:bg-amber-500",
          hoverBorder: "hover:border-amber-400",
          groupHoverText: "group-hover:text-amber-400",
          groupHoverSubText: "group-hover:text-slate-900"
        },
        {
          title: "AI를 위한 기초수학I",
          desc: "2~7주차 진법·논리·집합",
          url: "MathQuiz/mathQuiz.html",
          icon: "fa-square-root-variable",
          colorClass: "indigo",
          hoverBg: "hover:bg-indigo-600",
          hoverBorder: "hover:border-indigo-500",
          groupHoverText: "group-hover:text-indigo-400",
          groupHoverSubText: "group-hover:text-indigo-200"
        },
        {
          title: "C프로그래밍",
          desc: "1~7주차 문법·배열·함수",
          url: "CProgramming/CProgramming.html",
          icon: "fa-code",
          colorClass: "emerald",
          hoverBg: "hover:bg-emerald-600",
          hoverBorder: "hover:border-emerald-500",
          groupHoverText: "group-hover:text-emerald-400",
          groupHoverSubText: "group-hover:text-emerald-200"
        },
        {
          title: "데이터사이언스 기초",
          desc: "핵심 개념·데이터 분석 실전",
          url: "DataScienceQuiz/DataScienceQuiz.html",
          icon: "fa-chart-line",
          colorClass: "cyan",
          hoverBg: "hover:bg-cyan-600",
          hoverBorder: "hover:border-cyan-500",
          groupHoverText: "group-hover:text-cyan-400",
          groupHoverSubText: "group-hover:text-cyan-200"
        }
      ];
    }

    function renderSubjects() {
      modal.classList.add('hidden');
      content.classList.remove('hidden');

      const subjects = getSubjectData();
      subjectList.innerHTML = subjects.map(s => `
        <a href="${s.url}" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-800/80 ${s.hoverBg} border border-slate-700/80 ${s.hoverBorder} transition-all duration-200 text-left shadow-sm">
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-xl bg-${s.colorClass}-500/20 text-${s.colorClass}-400 group-hover:bg-slate-950 ${s.groupHoverText} flex items-center justify-center text-lg transition">
              <i class="fa-solid ${s.icon}"></i>
            </div>
            <div>
              <div class="font-bold text-white group-hover:text-white transition text-sm sm:text-base">${s.title}</div>
              <div class="text-xs text-slate-400 ${s.groupHoverSubText} transition">${s.desc}</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:text-white transition"></i>
        </a>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const enteredPassword = input.value.trim();
      const hash = await sha256(enteredPassword);

      if (hash === VERIFY_HASH) {
        sessionStorage.setItem('portal_auth', 'ok');
        renderSubjects();
      } else {
        errorMsg.classList.remove('hidden');
        input.value = '';
        input.focus();
      }
    });

    // 세션 유지 체크 (브라우저 탭 닫기 전까지는 새로고침해도 유지)
    if (sessionStorage.getItem('portal_auth') === 'ok') {
      renderSubjects();
    } else {
      input.focus();
    }
  </script>
</body>
</html>
